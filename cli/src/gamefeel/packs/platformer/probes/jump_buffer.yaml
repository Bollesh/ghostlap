probe: jump_buffer
title: Jump buffer
description: Fall onto flat ground and press jump k frames before landing.
requires: {actions: [jump]}
arena: air
settle: none
frames: 150
calibrate:
  frames: 150
  inputs: []
sweep: {var: k, from: 0, to: 12}
inputs:
  - {at: "cal.landed + 1 - k", action: jump, hold: 1}
measure: [jump.buffer_frames]
