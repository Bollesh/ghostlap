# Tight, responsive platforming. calibrated: false — placeholder ranges, see docs/calibration.md.
calibrated: false
metrics:
  jump.time_to_apex:    {good: [0.30, 0.45], warn: [0.25, 0.55]}
  # falling a bit faster than rising reads as weighty; much faster looks like being yanked down
  jump.fall_rise_ratio: {good: [1.15, 1.6], warn: [1.05, 2.0]}
  jump.fall_time:       {good: [0.24, 0.45], warn: [0.18, 0.6]}
  jump.coyote_frames:   {good: [4, 8], warn: [2, 10]}
  jump.buffer_frames:   {good: [4, 8], warn: [2, 12]}
  jump.variable:        {good: [1.5, 4.0], warn: [1.2, 6.0]}
  jump.height_max:      {good: [2.0, 5.0], warn: [1.2, 7.0]}
