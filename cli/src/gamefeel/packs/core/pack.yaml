name: core
title: Shared core (any directly controlled character)
description: >
  Metrics every controlled-character game shares: input latency, starting, stopping and
  turning, hit impact and frame cost. Not selectable on its own; genre packs include it.
selectable: false
vars: {move: right, back: left, ground: flat}
default_style: default
feel:
  input.latency_frames: {high: unresponsive}
  move.accel_time: {high: sluggish start}
  move.decel_time: {high: slippery stop}
  move.turnaround_time: {high: heavy turns}
  impact.hitstop_frames: {low: weightless hits, high: sticky hits}
  impact.knockback: {low: hits have no push, high: hits fling the player}
  impact.hp_lost: {high: multi-hit on one contact (no invulnerability frames)}
  perf.frame_spikes: {high: hitches}
