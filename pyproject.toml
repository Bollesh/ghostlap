[project]
name = "gamefeel"
version = "0.1.0"
description = "Understand a Godot game, measure how it feels, and tell your AI agent what to fix."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-gdscript>=6.0",
]

[project.scripts]
gamefeel = "gamefeel.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["cli/src", "cli/tests", "addons/gamefeel", "plugin", "docs", "README.md", "LICENSE"]
exclude = ["**/*.uid", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["cli/src/gamefeel"]
exclude = ["**/__pycache__"]

# the GDScript runtime ships inside the Python package; gamefeel runs it from there
[tool.hatch.build.targets.wheel.force-include]
"addons/gamefeel" = "gamefeel/_addon"

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
markers = ["godot: needs a Godot 4 binary on PATH (or GAMEFEEL_GODOT)"]
