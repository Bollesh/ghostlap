[project]
name = "ghostlap"
version = "0.2.0"
description = "Claude playtests your Godot game, proves what works, and turns each run into a replay test. Includes a game-feel toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-gdscript>=6.0",
]

[project.scripts]
ghostlap = "ghostlap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["cli/src", "cli/tests", "addons/ghostlap", "plugin", "docs", "README.md", "LICENSE"]
exclude = ["**/*.uid", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["cli/src/ghostlap"]
exclude = ["**/__pycache__"]

# the GDScript runtime ships inside the Python package; ghostlap runs it from there
[tool.hatch.build.targets.wheel.force-include]
"addons/ghostlap" = "ghostlap/_addon"

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
markers = ["godot: needs a Godot 4 binary on PATH (or GHOSTLAP_GODOT)",
           "render: needs Godot, ffmpeg and a display (or xvfb-run) to record clips"]
