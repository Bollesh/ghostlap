name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.3-stable", "4.7.2-stable"]   # oldest supported + latest tested
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Godot ${{ matrix.godot }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${{ matrix.godot }}_linux.x86_64 "$RUNNER_TEMP/godot"
          echo "GAMEFEEL_GODOT=$RUNNER_TEMP/godot" >> "$GITHUB_ENV"
      - name: Install ffmpeg and xvfb (for clip rendering tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: uv sync
      - run: xvfb-run -a -s "-screen 0 1280x720x24" uv run pytest -q
      - name: Build package
        run: uv build
